services:
  postgres:
    image: postgres:16-alpine
    container_name: microlearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: microlearn
      POSTGRES_PASSWORD: microlearn
      POSTGRES_DB: microlearn
    ports:
      - "5432:5432"
    volumes:
      - microlearn_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U microlearn -d microlearn"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: microlearn-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-devmasterkey}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - microlearn_meili:/meili_data

volumes:
  microlearn_pgdata:
  microlearn_meili:
