<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>MicroLearn</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #f5b544;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .brand {
        font-size: 14px;
        letter-spacing: 4px;
        text-transform: uppercase;
        opacity: 0.7;
      }
      .title {
        font-size: 26px;
        font-weight: 700;
        color: #fff;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: #f5b544;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
          transform: scale(0.9);
        }
        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="brand">MicroLearn</div>
      <div class="title">Wird geladen …</div>
      <div class="dot"></div>
    </div>
  </body>
</html>
