      <circle cx="16" cy="30" r="1.4"/><circle cx="24" cy="30" r="1.4"/><circle cx="32" cy="30" r="1.4"/><circle cx="40" cy="30" r="1.4"/><circle cx="48" cy="30" r="1.4"/><circle cx="56" cy="30" r="1.4"/><circle cx="64" cy="30" r="1.4"/><circle cx="72" cy="30" r="1.4"/><circle cx="80" cy="30" r="1.4"/>
