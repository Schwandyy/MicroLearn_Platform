      <circle cx="16" cy="56" r="1.4"/><circle cx="24" cy="56" r="1.4"/><circle cx="32" cy="56" r="1.4"/><circle cx="40" cy="56" r="1.4"/><circle cx="48" cy="56" r="1.4"/><circle cx="56" cy="56" r="1.4"/><circle cx="64" cy="56" r="1.4"/><circle cx="72" cy="56" r="1.4"/><circle cx="80" cy="56" r="1.4"/>
