<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ESP32 DevKit V1">
  <rect width="100" height="100" fill="#fafafa"/>
  <!-- PCB -->
  <rect x="20" y="10" width="60" height="80" rx="3" fill="#0f4c5c" stroke="#0a3540" stroke-width="1"/>
  <!-- ESP32 module (metal shield) -->
  <rect x="28" y="22" width="44" height="32" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="50" y="42" text-anchor="middle" fill="#1f2937" font-size="7" font-family="ui-monospace,monospace" font-weight="700">ESP32</text>
  <!-- USB-C port (top) -->
  <rect x="42" y="6" width="16" height="6" rx="1" fill="#1f2937"/>
  <!-- buttons -->
  <circle cx="32" cy="62" r="2.5" fill="#1f2937"/>
  <circle cx="68" cy="62" r="2.5" fill="#1f2937"/>
  <!-- LED indicators -->
  <circle cx="42" cy="70" r="1.3" fill="#dc2626"/>
  <circle cx="58" cy="70" r="1.3" fill="#3b82f6"/>
  <!-- pins (left + right rows) -->
  <g fill="#fbbf24">
    <rect x="16" y="20" width="4" height="2.5"/><rect x="16" y="26" width="4" height="2.5"/><rect x="16" y="32" width="4" height="2.5"/><rect x="16" y="38" width="4" height="2.5"/><rect x="16" y="44" width="4" height="2.5"/><rect x="16" y="50" width="4" height="2.5"/><rect x="16" y="56" width="4" height="2.5"/><rect x="16" y="62" width="4" height="2.5"/><rect x="16" y="68" width="4" height="2.5"/><rect x="16" y="74" width="4" height="2.5"/><rect x="16" y="80" width="4" height="2.5"/>
    <rect x="80" y="20" width="4" height="2.5"/><rect x="80" y="26" width="4" height="2.5"/><rect x="80" y="32" width="4" height="2.5"/><rect x="80" y="38" width="4" height="2.5"/><rect x="80" y="44" width="4" height="2.5"/><rect x="80" y="50" width="4" height="2.5"/><rect x="80" y="56" width="4" height="2.5"/><rect x="80" y="62" width="4" height="2.5"/><rect x="80" y="68" width="4" height="2.5"/><rect x="80" y="74" width="4" height="2.5"/><rect x="80" y="80" width="4" height="2.5"/>
  </g>
</svg>
