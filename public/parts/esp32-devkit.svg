<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="ESP32 DevKit V1">
  <rect width="100" height="100" fill="transparent"/>
  <!-- PCB (dunkel) -->
  <rect x="22" y="8" width="56" height="84" rx="3" fill="#0b0f19" stroke="#1f2937" stroke-width="0.6"/>
  <!-- Mounting holes -->
  <circle cx="26" cy="12" r="1.2" fill="#111827" stroke="#374151" stroke-width="0.3"/>
  <circle cx="74" cy="12" r="1.2" fill="#111827" stroke="#374151" stroke-width="0.3"/>
  <circle cx="26" cy="88" r="1.2" fill="#111827" stroke="#374151" stroke-width="0.3"/>
  <circle cx="74" cy="88" r="1.2" fill="#111827" stroke="#374151" stroke-width="0.3"/>
  <!-- Goldene Pin-Header beidseitig -->
  <g fill="#facc15" stroke="#b45309" stroke-width="0.3">
    <rect x="18" y="20" width="6" height="3" rx="0.5"/>
    <rect x="18" y="26" width="6" height="3" rx="0.5"/>
    <rect x="18" y="32" width="6" height="3" rx="0.5"/>
    <rect x="18" y="38" width="6" height="3" rx="0.5"/>
    <rect x="18" y="44" width="6" height="3" rx="0.5"/>
    <rect x="18" y="50" width="6" height="3" rx="0.5"/>
    <rect x="18" y="56" width="6" height="3" rx="0.5"/>
    <rect x="18" y="62" width="6" height="3" rx="0.5"/>
    <rect x="18" y="68" width="6" height="3" rx="0.5"/>
    <rect x="18" y="74" width="6" height="3" rx="0.5"/>
    <rect x="18" y="80" width="6" height="3" rx="0.5"/>
    <rect x="76" y="20" width="6" height="3" rx="0.5"/>
    <rect x="76" y="26" width="6" height="3" rx="0.5"/>
    <rect x="76" y="32" width="6" height="3" rx="0.5"/>
    <rect x="76" y="38" width="6" height="3" rx="0.5"/>
    <rect x="76" y="44" width="6" height="3" rx="0.5"/>
    <rect x="76" y="50" width="6" height="3" rx="0.5"/>
    <rect x="76" y="56" width="6" height="3" rx="0.5"/>
    <rect x="76" y="62" width="6" height="3" rx="0.5"/>
    <rect x="76" y="68" width="6" height="3" rx="0.5"/>
    <rect x="76" y="74" width="6" height="3" rx="0.5"/>
    <rect x="76" y="80" width="6" height="3" rx="0.5"/>
  </g>
  <!-- USB-Mikro-Port oben -->
  <rect x="44" y="3" width="12" height="9" rx="1.5" fill="#9ca3af" stroke="#4b5563" stroke-width="0.5"/>
  <rect x="46" y="5" width="8" height="5" rx="0.5" fill="#1f2937"/>
  <!-- ESP32-WROOM-32 Metallmodul -->
  <rect x="32" y="22" width="36" height="34" rx="1.5" fill="#d1d5db" stroke="#6b7280" stroke-width="0.6"/>
  <!-- Antennen-Mäander (PCB-Antenne) -->
  <path d="M 36 24 L 64 24 L 64 27 L 36 27 L 36 30 L 64 30" fill="none" stroke="#374151" stroke-width="0.8" stroke-linejoin="miter"/>
  <!-- A-Delivery Logo/Text-Imitation -->
  <text x="50" y="44" text-anchor="middle" fill="#0b0f19" font-size="5" font-family="ui-sans-serif,system-ui" font-weight="700" letter-spacing="0.5">A-Delivery</text>
  <text x="50" y="50" text-anchor="middle" fill="#374151" font-size="3" font-family="ui-monospace,monospace">ESP32-WROOM</text>
  <!-- CE/FCC-Marke -->
  <text x="60" y="54" text-anchor="middle" fill="#4b5563" font-size="2.5" font-family="ui-monospace,monospace">CE</text>
  <!-- USB-Serial-Chip (CP2102) -->
  <rect x="36" y="60" width="8" height="6" rx="0.5" fill="#1f2937" stroke="#000" stroke-width="0.2"/>
  <text x="40" y="64.2" text-anchor="middle" fill="#9ca3af" font-size="2" font-family="ui-monospace,monospace">CP</text>
  <!-- Spannungsregler -->
  <rect x="56" y="60" width="6" height="6" rx="0.5" fill="#1f2937"/>
  <!-- Tact-Switches: EN + BOOT -->
  <g>
    <rect x="34" y="72" width="6" height="6" rx="0.8" fill="#4b5563" stroke="#1f2937" stroke-width="0.4"/>
    <text x="37" y="83" text-anchor="middle" fill="#94a3b8" font-size="2.5" font-family="ui-monospace,monospace">EN</text>
    <rect x="60" y="72" width="6" height="6" rx="0.8" fill="#4b5563" stroke="#1f2937" stroke-width="0.4"/>
    <text x="63" y="83" text-anchor="middle" fill="#94a3b8" font-size="2.5" font-family="ui-monospace,monospace">BOOT</text>
  </g>
  <!-- LEDs -->
  <circle cx="45" cy="69" r="1" fill="#dc2626"/>
  <circle cx="55" cy="69" r="1" fill="#2563eb"/>
</svg>
