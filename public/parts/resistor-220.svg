<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="220 Ohm Widerstand">
  <rect width="100" height="100" fill="#fafafa"/>
  <!-- leads -->
  <line x1="2" y1="50" x2="22" y2="50" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="78" y1="50" x2="98" y2="50" stroke="#9ca3af" stroke-width="2.5" stroke-linecap="round"/>
  <!-- body -->
  <rect x="22" y="38" width="56" height="24" rx="8" fill="#fde68a" stroke="#a16207" stroke-width="1.2"/>
  <!-- color bands: 2 (red), 2 (red), 1 (brown) for 220Ω -->
  <rect x="34" y="38" width="4" height="24" fill="#dc2626"/>
  <rect x="42" y="38" width="4" height="24" fill="#dc2626"/>
  <rect x="50" y="38" width="4" height="24" fill="#a16207"/>
  <rect x="64" y="38" width="3" height="24" fill="#facc15"/>
  <!-- shading -->
  <path d="M 22 42 Q 50 30 78 42" fill="none" stroke="#fef3c7" stroke-width="2" opacity="0.7"/>
</svg>
