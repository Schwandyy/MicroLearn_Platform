<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Rote LED">
  <defs>
    <radialGradient id="ledShine" cx="40%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="#fafafa"/>
  <!-- legs -->
  <line x1="42" y1="62" x2="42" y2="92" stroke="#a3a3a3" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="58" y1="62" x2="58" y2="92" stroke="#a3a3a3" stroke-width="2.5" stroke-linecap="round"/>
  <!-- dome -->
  <path d="M 30 60 Q 30 25 50 22 Q 70 25 70 60 Z" fill="url(#ledShine)" stroke="#7f1d1d" stroke-width="1"/>
  <!-- base ring -->
  <ellipse cx="50" cy="60" rx="20" ry="3" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.5"/>
  <!-- shine -->
  <ellipse cx="44" cy="35" rx="5" ry="9" fill="#fecaca" opacity="0.7"/>
</svg>
