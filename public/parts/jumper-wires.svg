<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Jumper-Kabel Set">
  <rect width="100" height="100" fill="#fafafa"/>
  <!-- 5 colored wires laid out in a fan -->
  <g stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 14 20 Q 50 30 86 20" stroke="#ef4444"/>
    <path d="M 14 35 Q 50 45 86 35" stroke="#f97316"/>
    <path d="M 14 50 Q 50 60 86 50" stroke="#eab308"/>
    <path d="M 14 65 Q 50 75 86 65" stroke="#22c55e"/>
    <path d="M 14 80 Q 50 90 86 80" stroke="#3b82f6"/>
  </g>
  <!-- male pin headers (small dark blocks) at each end -->
  <g fill="#1f2937">
    <rect x="6" y="16"  width="10" height="6" rx="1"/>
    <rect x="6" y="31"  width="10" height="6" rx="1"/>
    <rect x="6" y="46"  width="10" height="6" rx="1"/>
    <rect x="6" y="61"  width="10" height="6" rx="1"/>
    <rect x="6" y="76"  width="10" height="6" rx="1"/>
    <rect x="84" y="16" width="10" height="6" rx="1"/>
    <rect x="84" y="31" width="10" height="6" rx="1"/>
    <rect x="84" y="46" width="10" height="6" rx="1"/>
    <rect x="84" y="61" width="10" height="6" rx="1"/>
    <rect x="84" y="76" width="10" height="6" rx="1"/>
  </g>
</svg>
